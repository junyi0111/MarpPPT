name: Build and package validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install preview rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fontconfig \
            fonts-noto-cjk \
            libreoffice-impress \
            poppler-utils
      - run: npm ci
      - run: npm test
      - run: npm run package:validate
      - run: npm audit --omit=dev
