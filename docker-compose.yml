services:
  marpppt-http:
    build:
      context: .
      dockerfile: Dockerfile
    image: markdown-to-editable-pptx-http:local
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      PPTX_OUTPUT_ROOT: /var/lib/marpppt/output
      MARPPPT_PUBLIC_BASE_URL: ${MARPPPT_PUBLIC_BASE_URL:-}
      MARPPPT_MAX_REQUEST_BYTES: "2097152"
      MARPPPT_MAX_ACTIVE_REQUESTS: "8"
      MARPPPT_MAX_ACTIVE_JOBS: "2"
    volumes:
      - marpppt-output:/var/lib/marpppt/output
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp/marpppt:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0700
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 128

volumes:
  marpppt-output:
